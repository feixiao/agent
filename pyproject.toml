[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-in-depth"
version = "0.1.0"
description = "深入 AI Agent 开发：设计原理、Harness 底座工程、经典模式、10 章配套实战与垂直场景"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Frank", email = "frank@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.9.0",
    "typing_extensions>=4.5.0",
    "python-dotenv>=1.0.0",
    "openai>=1.68",
    "requests>=2.31",
]

[project.optional-dependencies]
# --- Patterns (8 Agentic Design Patterns) ---
patterns-langchain = [
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langchain-openai>=0.1.0",
    "crewai>=0.80.0",
    "langgraph>=0.2.0",
    "nest_asyncio>=1.5.0",
]
patterns-autogen = [
    "autogen-agentchat>=0.4.0",
    "autogen-ext[ollama]>=0.4.0",
    "autogen-ext[openai]>=0.4.0",
    "autogen-core>=0.4.0",
]
patterns = [
    "agent-in-depth[patterns-langchain,patterns-autogen]",
]

# --- Perception & Multimodal Labs ---
perception = [
    "numpy>=1.24.0",
]

# --- Evals & Development ---
evals = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

# --- Capability groups (from ai-agent-book) ---
viz = [
    "colorama>=0.4.6",
    "matplotlib>=3.8.0",
    "numpy>=1.26.4",
    "pandas>=2.2.0",
    "rich>=13.7",
    "seaborn>=0.13.0",
    "tabulate>=0.9",
    "tenacity>=9.0.0",
    "tqdm>=4.66.1",
]

docs = [
    "pypdf>=4.0",
    "PyPDF2>=3.0",
    "pdfplumber>=0.10.3",
    "reportlab>=4.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
]

media = [
    "pillow>=10.2",
    "opencv-python-headless>=4.9",
]

web = [
    "aiohttp>=3.9.3",
    "anyio>=4.5.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.1.0",
    "html2text>=2020.1.16",
    "playwright>=1.40",
]

browser = [
    "agent-in-depth[web]",
    "browser-use>=0.1.40; python_version >= '3.11'",
]

serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

tokens = [
    "tiktoken>=0.7.0",
]

analysis = [
    "scikit-learn>=1.5.0",
    "scipy>=1.11",
    "plotly>=5.18",
    "sympy>=1.12",
    "numba>=0.59",
]

torch = [
    "torch>=2.1.0",
    "transformers>=4.40,<6",
]

rag = [
    "agent-in-depth[tokens]",
    "chromadb>=0.5.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.2",
    "rank-bm25>=0.2.2",
    "FlagEmbedding>=1.2.11",
    "huggingface-hub>=0.34.0",
    "annoy>=1.17.3",
    "hnswlib>=0.8",
    "jieba>=0.42.1",
    "networkx>=3.2",
    "umap-learn>=0.5.4",
    "aiofiles>=24.1.0",
    "colorlog>=6.8",
    "loguru>=0.7.2",
    "markdown>=3.5",
    "PyYAML>=6.0",
]

integrations = [
    "arxiv>=2.1",
    "wikipedia>=1.4",
    "waybackpy>=3.0",
    "yfinance>=0.2",
    "youtube-transcript-api>=0.6",
    "yt-dlp>=2024.4",
    "python-chess>=1.10",
    "notion-client>=2.2",
    "sendgrid>=6.11",
    "aiosmtplib>=3.0",
    "PyGithub>=2.3",
    "google-api-python-client>=2.126",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "psutil>=5.9.8",
    "langchain-openai>=0.1",
]

orchestration = [
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "slack-sdk>=3.27",
    "python-dateutil>=2.9",
]

solvers = [
    "python-constraint2>=2.0.2",
]

mem = [
    "mem0ai[nlp]>=2.0,<3",
    "memobase>=0.0.27; python_version >= '3.11'",
]

mcp = [
    "mcp[cli]>=1.0",
    "fastmcp>=0.2",
]

providers = [
    "anthropic>=0.40.0",
    "google-genai>=0.3",
    "mistralai>=1.2.0",
    "litellm>=1.94.1",
    "ollama>=0.5.1",
]

train = [
    "agent-in-depth[torch]",
    "datasets>=3.4.1",
    "accelerate>=0.30",
    "peft>=0.17.0",
    "trl>=0.22.2",
    "sentencepiece>=0.2",
    "wandb>=0.17",
    "trackio>=0.1",
    "transformers>=4.55,<6",
    "bitsandbytes>=0.45",
]

unsloth = [
    "agent-in-depth[train]",
    "unsloth>=2026.7.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "unsloth_zoo>=2026.7.7; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

vllm = [
    "agent-in-depth[torch]",
    "vllm>=0.26; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "torchaudio>=2.1.0",
    "snac>=1.2",
]

dev = [
    "httpx>=0.27,<1",
    "Markdown>=3.5,<4",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

# --- Chapter aggregates (ch1 - ch10) ---
ch1  = ["agent-in-depth[viz,docs]"]
ch2  = ["agent-in-depth[viz,docs,web,serve,providers,tokens,torch]"]
ch3  = ["agent-in-depth[viz,docs,web,serve,rag,mem,analysis,torch,providers]"]
ch4  = [
    "agent-in-depth[viz,docs,media,browser,serve,mcp,tokens,analysis,integrations]",
    "PyMuPDF>=1.24.0",
]
ch5  = ["agent-in-depth[viz,docs,media,web,serve,mcp,providers,analysis,solvers]", "PyMuPDF>=1.25.0"]
ch6  = ["agent-in-depth[viz,tokens,analysis,providers]", "fish-audio-sdk>=1.3.0,<2"]
ch7  = ["agent-in-depth[train,audio,viz]"]
ch8  = ["agent-in-depth[viz,docs,media,browser,serve,rag,mcp,providers,orchestration]"]
ch9  = [
    "agent-in-depth[serve]",
    "httpx>=0.27",
    "playwright>=1.40",
    "aiortc>=1.10",
    "openai-whisper>=20240930",
    "torch>=2.1.0",
]
ch10 = ["agent-in-depth[tokens,web]"]

book = ["agent-in-depth[ch1,ch2,ch3,ch4,ch5,ch6,ch7,ch8,ch9,ch10]"]

all = [
    "agent-in-depth[patterns,perception,evals,viz,docs,media,web,browser,serve,rag,mem,mcp,providers,tokens,analysis,solvers,integrations,orchestration,dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
where = [".", "experiments"]
include = ["core*", "tools*", "patterns*", "perception*", "apps*", "agentbook*"]
exclude = ["tests*", "docs*"]
