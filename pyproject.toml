[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-in-depth"
version = "0.1.0"
description = "深入 AI Agent 开发：设计原理、Harness 底座工程、经典模式与垂直场景实战"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Frank", email = "frank@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0.0",
    "typing_extensions>=4.5.0",
]

[project.optional-dependencies]
patterns-langchain = [
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-ollama>=0.1.0",
    "nest_asyncio>=1.5.0",
]
patterns-autogen = [
    "autogen-agentchat>=0.4.0",
    "autogen-ext[ollama]>=0.4.0",
    "autogen-core>=0.4.0",
]
perception = [
    "numpy>=1.24.0",
]
evals = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
all = [
    "agent-in-depth[patterns-langchain,patterns-autogen,perception,evals]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
