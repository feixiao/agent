schema_version = "1.4"

[task]
name = "agent-in-depth/fix-service-port"
description = "Repair port and healthcheck path in /app/service_config.json."
keywords = ["config", "smoke", "harbor-format"]

[metadata]
difficulty = "easy"
category = "ops-config"

[agent]
timeout_sec = 120.0

[verifier]
timeout_sec = 60.0
environment_mode = "separate"

[environment]
network_mode = "no-network"
cpus = 1
memory_mb = 512
storage_mb = 2048
workdir = "/app"
